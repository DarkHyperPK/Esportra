name: 🔄 Deploy DB Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: db-migrations-prod
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: 🚀 Deploy Migrations to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Push Migrations via SSH Tunnel
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          # 1. Trust the host
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

          # 2. Open SSH tunnel: local 5432 → server's Postgres 5432
          ssh -o StrictHostKeyChecking=no -f -N -L 5432:127.0.0.1:5432 $SERVER_USER@$SERVER_IP

          # 3. Rewrite DB URL to point through the tunnel
          TUNNELED_DB_URL="${PROD_DB_URL/$SERVER_IP/127.0.0.1}"

          # 4. Push only new migrations (skips already-applied ones automatically)
          echo "Pushing migrations through secure SSH tunnel..."
          PGSSLMODE=disable supabase db push --db-url "$TUNNELED_DB_URL"

          # NOTE: If migration history ever drifts (e.g. IDs in the DB that no longer
          # exist locally), run repair manually before re-triggering this workflow:
          #   PGSSLMODE=disable supabase migration repair --status reverted <id> ... --db-url "$TUNNELED_DB_URL"
