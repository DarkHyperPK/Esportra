name: 🔄 Deploy DB Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: db-migrations-prod
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: 🚀 Deploy Migrations to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Push Migrations via SSH Tunnel
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          # 1. Trust the host
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

          # 2. Open SSH tunnel: local 5432 → server's Postgres 5432
          ssh -o StrictHostKeyChecking=no -f -N -L 5432:127.0.0.1:5432 $SERVER_USER@$SERVER_IP

          # 3. Rewrite DB URL to point through the tunnel
          TUNNELED_DB_URL="${PROD_DB_URL/$SERVER_IP/127.0.0.1}"

          # 4. Push migrations — auto-repair history drift if detected, then retry
          echo "Pushing migrations through secure SSH tunnel..."
          set +e
          PUSH_OUTPUT=$(PGSSLMODE=disable supabase db push --db-url "$TUNNELED_DB_URL" 2>&1)
          PUSH_EXIT=$?
          set -e

          if [ $PUSH_EXIT -ne 0 ]; then
            if echo "$PUSH_OUTPUT" | grep -q "Remote migration versions not found"; then
              echo "⚠️  Migration history drift detected. Auto-repairing..."
              # supabase CLI prints the exact repair command in the error — extract the IDs from it
              REPAIR_IDS=$(echo "$PUSH_OUTPUT" | grep -oP '(?<=repair --status reverted )[0-9 ]+' | head -1)
              if [ -n "$REPAIR_IDS" ]; then
                echo "Repairing remote-only IDs: $REPAIR_IDS"
                PGSSLMODE=disable supabase migration repair --status reverted $REPAIR_IDS --db-url "$TUNNELED_DB_URL"
                echo "Retrying push after repair..."
                PGSSLMODE=disable supabase db push --db-url "$TUNNELED_DB_URL"
              else
                echo "$PUSH_OUTPUT"
                exit 1
              fi
            else
              echo "$PUSH_OUTPUT"
              exit 1
            fi
          else
            echo "$PUSH_OUTPUT"
          fi
