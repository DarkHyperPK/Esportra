name: CI — Partner Portal

on:
  push:
    branches: [staging, main]
    paths:
      - 'partner-portal/**'
      - '.github/workflows/ci-partner-portal.yml'
  pull_request:
    branches: [staging, main]
    paths:
      - 'partner-portal/**'

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner-portal
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: partner-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          VITE_API_URL: https://placeholder.api.com
          VITE_PARTNER_URL: https://placeholder.partner.com
        run: npm run build
