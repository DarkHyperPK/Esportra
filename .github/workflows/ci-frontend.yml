name: CI — Frontend

on:
  workflow_dispatch:
  push:
    branches: [main, 'deploy/**']
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'components.json'
      - 'tools/**'
      - 'scripts/**'
      - 'src/data/gameCatalogAssets.json'
      - 'src/data/gameCatalogSync.json'
      - 'vite.config.*'
      - 'playwright.config.ts'
      - 'index.html'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'components.json'
      - 'tools/**'
      - 'scripts/**'
      - 'src/data/gameCatalogAssets.json'
      - 'src/data/gameCatalogSync.json'
      - 'vite.config.*'
      - 'playwright.config.ts'
      - 'index.html'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check App Route Symbols
        run: npm run check:app-routes

      - name: Check Critical Runtime Symbols
        run: npm run check:critical-symbols

      - name: Verify game catalog sync manifest
        run: npm run check:game-catalog-sync

      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          VITE_API_URL: https://placeholder.api.com
          VITE_APP_NAME: Esportra
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
