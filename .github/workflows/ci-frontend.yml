name: CI — Frontend

on:
  push:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'vite.config.*'
      - 'index.html'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'vite.config.*'
      - 'index.html'

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dead code check (knip — files, deps, binaries)
        run: npm run knip:strict

      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          VITE_API_URL: https://placeholder.api.com
          VITE_APP_NAME: Esportra
        run: npm run build
