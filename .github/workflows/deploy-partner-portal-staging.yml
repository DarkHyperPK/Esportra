name: Partner Portal — Staging

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'partner-portal/**'
      - '.github/workflows/deploy-partner-portal-*'

concurrency:
  group: deploy-staging-partner-portal
  cancel-in-progress: true

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_PARTNER_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_PARTNER_SUPABASE_ANON_KEY }}
  VITE_API_URL: ${{ secrets.VITE_PARTNER_API_URL }}

defaults:
  run:
    working-directory: partner-portal

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: partner-portal/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  promote:
    name: Promote to deploy/partner-portal-staging
    needs: [build-and-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/promote-deploy-branch
        with:
          deploy_branch: deploy/partner-portal-staging

  notify-failure:
    name: Report failure
    needs: [build-and-lint, promote]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-failure
        with:
          webhook_url: ${{ secrets.CI_NOTIFY_WEBHOOK_URL }}
