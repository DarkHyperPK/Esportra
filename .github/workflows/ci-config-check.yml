name: CI — Config health check

# Validates E2E secrets and auth without a code push. Fails only when config is broken.
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e-secrets:
    name: E2E credentials & API auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight staging E2E secrets
        env:
          E2E_API_URL: ${{ secrets.E2E_STAGING_API_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
          E2E_PLAYER1_EMAIL: ${{ secrets.E2E_PLAYER1_EMAIL }}
          E2E_PLAYER1_PASSWORD: ${{ secrets.E2E_PLAYER1_PASSWORD }}
          E2E_PLAYER2_EMAIL: ${{ secrets.E2E_PLAYER2_EMAIL }}
          E2E_PLAYER2_PASSWORD: ${{ secrets.E2E_PLAYER2_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          PREFLIGHT_REQUIRE_VITE: 'true'
        run: bash .github/scripts/e2e-preflight.sh

  notify-config-failure:
    name: Report config failure
    needs: e2e-secrets
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-failure
        with:
          webhook_url: ${{ secrets.CI_NOTIFY_WEBHOOK_URL }}
