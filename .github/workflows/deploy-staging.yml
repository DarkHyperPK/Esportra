name: Build & Deploy — Staging (Frontend)

on:
  push:
    branches: [staging]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package*.json'
      - 'eslint.config.js'
      - 'vite.config.*'
      - 'playwright.config.ts'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_APP_NAME: Esportra

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:app-routes
      - run: npm run check:critical-symbols
      - run: npm run build

  e2e-staging:
    name: Playwright (staging full suite)
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4173

      - name: Wait for staging API
        env:
          API_URL: ${{ secrets.E2E_STAGING_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "E2E_STAGING_API_URL not set — skipping E2E."
            exit 0
          fi
          for i in $(seq 1 30); do
            curl -sf "${API_URL}/health/ready" && exit 0
            sleep 5
          done
          echo "Staging API not ready" >&2
          exit 1

      - name: Run staging E2E
        env:
          CI: true
          BASE_URL: http://127.0.0.1:4173
          E2E_API_URL: ${{ secrets.E2E_STAGING_API_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
          E2E_PLAYER1_EMAIL: ${{ secrets.E2E_PLAYER1_EMAIL }}
          E2E_PLAYER1_PASSWORD: ${{ secrets.E2E_PLAYER1_PASSWORD }}
          E2E_PLAYER2_EMAIL: ${{ secrets.E2E_PLAYER2_EMAIL }}
          E2E_PLAYER2_PASSWORD: ${{ secrets.E2E_PLAYER2_PASSWORD }}
          E2E_BR_GAME_ROOM_PATH: br-lobby
        run: |
          if [ -z "$E2E_API_URL" ]; then
            echo "E2E secrets not configured — skipping."
            exit 0
          fi
          npm run test:e2e:staging

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-staging-report
          path: |
            test-results/
            playwright-report/

  promote:
    name: Promote to deploy/staging
    needs: e2e-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/promote-deploy-branch
        with:
          deploy_branch: deploy/staging

  smoke:
    name: Post-deploy smoke (staging site)
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Coolify deploy
        run: sleep 120

      - name: Smoke check
        env:
          BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
          API_URL: ${{ secrets.E2E_STAGING_API_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "E2E_STAGING_BASE_URL not set — skipping smoke."
            exit 0
          fi
          bash .github/scripts/smoke-check.sh "$BASE_URL" "$API_URL"
