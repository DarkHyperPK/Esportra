name: Build & Deploy — Staging

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'eslint.config.js'
      - 'tools/**'
      - 'vite.config.*'
      - 'index.html'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'

concurrency:
  group: deploy-staging-frontend
  cancel-in-progress: true

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_APP_NAME: Esportra

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:app-routes
      - run: npm run check:critical-symbols
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build-and-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Run tests
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          VITE_API_URL: https://placeholder.api.com
        run: npm run test --if-present

  promote:
    name: Promote to deploy/staging
    needs: [build-and-lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/promote-deploy-branch
        with:
          deploy_branch: deploy/staging

  smoke:
    name: Post-deploy smoke (staging site)
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Coolify deploy
        run: sleep 120

      - name: Smoke check
        env:
          BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
          API_URL: ${{ secrets.E2E_STAGING_API_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning title=Smoke skipped::E2E_STAGING_BASE_URL not set — post-deploy smoke skipped."
            exit 0
          fi
          bash .github/scripts/smoke-check.sh "$BASE_URL" "$API_URL"

  notify-failure:
    name: Report failure
    needs: [build-and-lint, test, promote, smoke]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-failure
        with:
          webhook_url: ${{ secrets.CI_NOTIFY_WEBHOOK_URL }}
