name: 🚀 Deploy Staging Edge Functions

on:
  push:
    branches:
      - staging
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  deploy:
    name: Sync Functions to Staging Server
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 📂 List changed functions
        run: |
          echo "Functions to deploy to staging:"
          ls -la supabase/functions/

      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy Functions via SCP + SSH
        env:
          SSH_OPTS: "-o StrictHostKeyChecking=no"
          REMOTE: "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}"
          STAGING_FUNCTIONS_PATH: ${{ secrets.STAGING_FUNCTIONS_PATH }}
        run: |
          # 1. Trust the host
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          # 2. Create staging directory on server
          echo "📂 Preparing staging area..."
          ssh $SSH_OPTS $REMOTE "mkdir -p /tmp/edge-functions-staging-update"

          # 3. Copy function files to the server
          echo "📤 Uploading functions..."
          scp -r $SSH_OPTS supabase/functions $REMOTE:/tmp/edge-functions-staging-update

          # 4. Move files to the staging volume with correct permissions
          echo "🚚 Moving to staging volume..."
          ssh $SSH_OPTS $REMOTE "sudo mkdir -p $STAGING_FUNCTIONS_PATH && \
            sudo cp -r /tmp/edge-functions-staging-update/functions/* $STAGING_FUNCTIONS_PATH/ && \
            sudo chown -R 1000:1000 $STAGING_FUNCTIONS_PATH/ && \
            sudo rm -rf /tmp/edge-functions-staging-update && \
            echo '✅ Staging Deployment Finished!' && \
            sudo ls -la $STAGING_FUNCTIONS_PATH/"

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Functions synced to staging server." >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
