name: 🔄 Deploy Staging Migrations

on:
  push:
    branches:
      - staging
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: db-migrations-staging
  cancel-in-progress: false

jobs:
  deploy-migrations:
    name: 🚀 Deploy Migrations to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Push Migrations via SSH Tunnel to Staging
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          # 1. Trust the host
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

          # 2. Open SSH tunnel: local 5433 → server's staging Postgres 5433
          ssh -o StrictHostKeyChecking=no -f -N -L 5433:127.0.0.1:5433 $SERVER_USER@$SERVER_IP

          # 3. Rewrite DB URL to point through the tunnel
          TUNNELED_DB_URL="${STAGING_DB_URL/$SERVER_IP/127.0.0.1}"

          # 4. Push migrations to staging
          # --include-all ensures migrations are applied even if staging history
          # is out of sync after a prod→staging DB restore.
          echo "Pushing migrations to staging through secure SSH tunnel..."
          PGSSLMODE=disable supabase db push --include-all --db-url "$TUNNELED_DB_URL"
