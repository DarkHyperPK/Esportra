name: 🚀 Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Manual trigger from GitHub UI

env:
  FUNCTIONS_PATH: /data/coolify/services/moooksg0ssk04cg8coksgowc/volumes/functions

jobs:
  deploy:
    name: Sync Functions to Server
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 📂 List changed functions
        run: |
          echo "Functions to deploy:"
          ls -la supabase/functions/

      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy Functions via SCP + SSH
        env:
          SSH_OPTS: "-o StrictHostKeyChecking=no"
          REMOTE: "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}"
        run: |
          # 1. Create staging directory on server
          ssh $SSH_OPTS $REMOTE "mkdir -p /tmp/edge-functions-update"

          # 2. Copy function files to the server
          scp -r $SSH_OPTS supabase/functions/* $REMOTE:/tmp/edge-functions-update/

          # 3. Move files to the live volume with correct permissions
          ssh $SSH_OPTS $REMOTE "sudo mkdir -p ${{ env.FUNCTIONS_PATH }} && sudo cp -r /tmp/edge-functions-update/* ${{ env.FUNCTIONS_PATH }}/ && sudo chown -R 1000:1000 ${{ env.FUNCTIONS_PATH }}/ && rm -rf /tmp/edge-functions-update && echo 'Functions deployed:' && ls ${{ env.FUNCTIONS_PATH }}/"

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Functions synced to production server." >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
