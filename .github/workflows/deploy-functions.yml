name: 🚀 Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: deploy-functions-prod
  cancel-in-progress: false

env:
  FUNCTIONS_PATH: /data/coolify/services/moooksg0ssk04cg8coksgowc/volumes/functions

jobs:
  deploy:
    name: Sync Functions to Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 📂 List functions
        run: |
          echo "Functions to deploy:"
          ls -la supabase/functions/

      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy Functions via SCP + SSH
        env:
          SSH_OPTS: "-o StrictHostKeyChecking=no"
          REMOTE: "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}"
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          echo "📂 Preparing temp area..."
          ssh $SSH_OPTS $REMOTE "mkdir -p /tmp/edge-functions-update"

          echo "📤 Uploading functions..."
          scp -r $SSH_OPTS supabase/functions $REMOTE:/tmp/edge-functions-update

          echo "🚚 Moving to production volume..."
          ssh $SSH_OPTS $REMOTE "sudo mkdir -p ${{ env.FUNCTIONS_PATH }} && \
            sudo cp -r /tmp/edge-functions-update/functions/* ${{ env.FUNCTIONS_PATH }}/ && \
            sudo chown -R 1000:1000 ${{ env.FUNCTIONS_PATH }}/ && \
            sudo rm -rf /tmp/edge-functions-update && \
            echo '✅ Deployment Finished!' && \
            sudo ls -la ${{ env.FUNCTIONS_PATH }}/"

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Functions synced to production server." >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
