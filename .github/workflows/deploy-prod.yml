# See docs/ci-cd-setup.md
name: Build & Deploy — Production (Frontend)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package*.json'
      - 'eslint.config.js'
      - 'tools/**'
      - 'vite.config.*'
      - 'playwright.config.ts'
      - 'index.html'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'

concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:app-routes
      - run: npm run check:critical-symbols
      - name: Build (production Vite env)
        env:
          VITE_PROD_SUPABASE_URL: ${{ secrets.VITE_PROD_SUPABASE_URL }}
          VITE_PROD_SUPABASE_ANON_KEY: ${{ secrets.VITE_PROD_SUPABASE_ANON_KEY }}
          VITE_PROD_API_URL: ${{ secrets.VITE_PROD_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          export VITE_SUPABASE_URL="${VITE_PROD_SUPABASE_URL:-${VITE_SUPABASE_URL:-https://placeholder.supabase.co}}"
          export VITE_SUPABASE_ANON_KEY="${VITE_PROD_SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder}}"
          export VITE_API_URL="${VITE_PROD_API_URL:-${VITE_API_URL:-https://placeholder.api.com}}"
          export VITE_APP_NAME=Esportra
          npm run build

  e2e-preflight:
    name: E2E preflight (secrets & auth)
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate promotion E2E configuration
        env:
          E2E_API_URL: ${{ secrets.E2E_STAGING_API_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
          E2E_PLAYER1_EMAIL: ${{ secrets.E2E_PLAYER1_EMAIL }}
          E2E_PLAYER1_PASSWORD: ${{ secrets.E2E_PLAYER1_PASSWORD }}
          E2E_PLAYER2_EMAIL: ${{ secrets.E2E_PLAYER2_EMAIL }}
          E2E_PLAYER2_PASSWORD: ${{ secrets.E2E_PLAYER2_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          PREFLIGHT_REQUIRE_VITE: 'true'
        run: bash .github/scripts/e2e-preflight.sh

  promote:
    name: Promote to deploy/main
    needs: [build-and-lint, e2e-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/promote-deploy-branch
        with:
          deploy_branch: deploy/main

  smoke:
    name: Post-deploy smoke (production site)
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Coolify deploy
        run: sleep 120

      - name: Smoke check
        env:
          BASE_URL: ${{ secrets.E2E_PROD_BASE_URL }}
          API_URL: ${{ secrets.E2E_PROD_API_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning title=Smoke skipped::E2E_PROD_BASE_URL not set — post-deploy smoke skipped."
            exit 0
          fi
          bash .github/scripts/smoke-check.sh "$BASE_URL" "$API_URL"

  notify-failure:
    name: Report failure
    needs: [build-and-lint, e2e-preflight, promote, smoke]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-failure
        with:
          webhook_url: ${{ secrets.CI_NOTIFY_WEBHOOK_URL }}
