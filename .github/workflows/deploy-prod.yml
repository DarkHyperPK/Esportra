name: Build & Deploy — Production (Frontend)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package*.json'
      - 'vite.config.*'
      - 'playwright.config.ts'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check:app-routes
      - run: npm run check:critical-symbols
      - name: Build
        env:
          VITE_PROD_SUPABASE_URL: ${{ secrets.VITE_PROD_SUPABASE_URL }}
          VITE_PROD_SUPABASE_ANON_KEY: ${{ secrets.VITE_PROD_SUPABASE_ANON_KEY }}
          VITE_PROD_API_URL: ${{ secrets.VITE_PROD_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          export VITE_SUPABASE_URL="${VITE_PROD_SUPABASE_URL:-$VITE_SUPABASE_URL}"
          export VITE_SUPABASE_ANON_KEY="${VITE_PROD_SUPABASE_ANON_KEY:-$VITE_SUPABASE_ANON_KEY}"
          export VITE_API_URL="${VITE_PROD_API_URL:-$VITE_API_URL}"
          export VITE_APP_NAME=Esportra
          npm run build

  e2e-promotion:
    name: Playwright (@promotion gate)
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build preview bundle
        env:
          VITE_PROD_SUPABASE_URL: ${{ secrets.VITE_PROD_SUPABASE_URL }}
          VITE_PROD_SUPABASE_ANON_KEY: ${{ secrets.VITE_PROD_SUPABASE_ANON_KEY }}
          VITE_PROD_API_URL: ${{ secrets.VITE_PROD_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          export VITE_SUPABASE_URL="${VITE_PROD_SUPABASE_URL:-$VITE_SUPABASE_URL}"
          export VITE_SUPABASE_ANON_KEY="${VITE_PROD_SUPABASE_ANON_KEY:-$VITE_SUPABASE_ANON_KEY}"
          export VITE_API_URL="${VITE_PROD_API_URL:-$VITE_API_URL}"
          export VITE_APP_NAME=Esportra
          npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4173

      - name: Wait for API
        env:
          API_URL: ${{ secrets.E2E_PROD_API_URL }}
        run: |
          API_URL="${API_URL:-${{ secrets.E2E_STAGING_API_URL }}}"
          if [ -z "$API_URL" ]; then
            echo "E2E_PROD_API_URL not set — skipping E2E."
            exit 0
          fi
          for i in $(seq 1 30); do
            curl -sf "${API_URL}/health/ready" && exit 0
            sleep 5
          done
          echo "API not ready" >&2
          exit 1

      - name: Run promotion E2E
        env:
          CI: true
          BASE_URL: http://127.0.0.1:4173
          E2E_API_URL: ${{ secrets.E2E_PROD_API_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_PROD_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_PROD_SUPABASE_ANON_KEY }}
          E2E_ORGANIZER_EMAIL: ${{ secrets.E2E_ORGANIZER_EMAIL }}
          E2E_ORGANIZER_PASSWORD: ${{ secrets.E2E_ORGANIZER_PASSWORD }}
          E2E_PLAYER1_EMAIL: ${{ secrets.E2E_PLAYER1_EMAIL }}
          E2E_PLAYER1_PASSWORD: ${{ secrets.E2E_PLAYER1_PASSWORD }}
          E2E_PLAYER2_EMAIL: ${{ secrets.E2E_PLAYER2_EMAIL }}
          E2E_PLAYER2_PASSWORD: ${{ secrets.E2E_PLAYER2_PASSWORD }}
        run: |
          if [ -z "$E2E_API_URL" ]; then
            E2E_API_URL="${{ secrets.E2E_STAGING_API_URL }}"
          fi
          if [ -z "$E2E_SUPABASE_URL" ]; then
            E2E_SUPABASE_URL="${{ secrets.E2E_SUPABASE_URL }}"
          fi
          if [ -z "$E2E_SUPABASE_ANON_KEY" ]; then
            E2E_SUPABASE_ANON_KEY="${{ secrets.E2E_SUPABASE_ANON_KEY }}"
          fi
          if [ -z "$E2E_API_URL" ]; then
            echo "E2E secrets not configured — skipping."
            exit 0
          fi
          export E2E_API_URL E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY
          npm run test:e2e:promotion

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-promotion-report
          path: |
            test-results/
            playwright-report/

  promote:
    name: Promote to deploy/main
    needs: e2e-promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/promote-deploy-branch
        with:
          deploy_branch: deploy/main

  smoke:
    name: Post-deploy smoke (production site)
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Coolify deploy
        run: sleep 120

      - name: Smoke check
        env:
          BASE_URL: ${{ secrets.E2E_PROD_BASE_URL }}
          API_URL: ${{ secrets.E2E_PROD_API_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "E2E_PROD_BASE_URL not set — skipping smoke."
            exit 0
          fi
          bash .github/scripts/smoke-check.sh "$BASE_URL" "$API_URL"
