<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Esportra" />
  <title>Esportra - Esports Tournaments & Gaming Platform</title>
  <meta name="description"
    content="Esportra helps you create, manage, and play esports tournaments across multiple games." />
  <meta name="author" content="Esportra" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS Icons -->
  <link rel="apple-touch-icon"
    href="%VITE_SUPABASE_URL%/storage/v1/object/public/system.assets.website/eSportra-Logo/eSPORTRA-icon.ico" />
  <link rel="icon" type="image/x-icon"
    href="%VITE_SUPABASE_URL%/storage/v1/object/public/system.assets.website/eSportra-Logo/eSPORTRA-icon.ico" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#8b5cf6" />



  <!-- Preconnect + preload Google Fonts (non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" />

  <meta property="og:title" content="Esportra - Esports Tournaments & Gaming Platform" />
  <meta property="og:description" content="Create, manage, and play esports tournaments across multiple games." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.svg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/logo.svg" />
</head>

<body style="background-color: #050505;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
