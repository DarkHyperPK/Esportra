<!DOCTYPE html>
<html>
<head>
    <title>Image CORS Test</title>
</head>
<body>
    <h1>Testing Map Image Loading</h1>
    <div id="status"></div>
    <img id="testImg" style="max-width: 400px; border: 2px solid #ccc;">
    
    <script>
        const testUrl = 'https://abbjywqlxnxoutllbgke.supabase.co/storage/v1/object/public/system.assets.website/Valorant%20Maps%20Pictures/Abyss.webp';
        const statusDiv = document.getElementById('status');
        const img = document.getElementById('testImg');
        
        statusDiv.innerHTML = `<p>Testing URL: ${testUrl}</p>`;
        
        img.onload = () => {
            statusDiv.innerHTML += '<p style="color: green;">✅ Image loaded successfully!</p>';
            console.log('Image loaded successfully');
        };
        
        img.onerror = (e) => {
            statusDiv.innerHTML += '<p style="color: red;">❌ Image failed to load</p>';
            console.error('Image load error:', e);
            console.error('Error type:', e.type);
            console.error('Error target:', e.target);
        };
        
        // Try to fetch with more details
        fetch(testUrl, { mode: 'no-cors' })
            .then(response => {
                console.log('Fetch (no-cors) succeeded:', response);
                statusDiv.innerHTML += '<p>Fetch with no-cors mode: Success</p>';
            })
            .catch(error => {
                console.error('Fetch (no-cors) failed:', error);
                statusDiv.innerHTML += `<p style="color: orange;">Fetch with no-cors failed: ${error.message}</p>`;
            });
        
        fetch(testUrl, { mode: 'cors' })
            .then(response => {
                console.log('Fetch (cors) succeeded:', response);
                statusDiv.innerHTML += '<p>Fetch with CORS mode: Success</p>';
            })
            .catch(error => {
                console.error('Fetch (cors) failed:', error);
                statusDiv.innerHTML += `<p style="color: red;">Fetch with CORS failed: ${error.message}</p>`;
            });
        
        img.src = testUrl;
    </script>
</body>
</html>
