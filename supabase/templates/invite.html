<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You've been invited to Esportra</title>
</head>

<body
    style="margin: 0; padding: 0; background-color: #09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
    <table width="100%" border="0" cellspacing="0" cellpadding="0"
        style="background-color: #09090b; width: 100%; height: 100%;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <!-- Container -->
                <table width="100%" border="0" cellspacing="0" cellpadding="0"
                    style="max-width: 600px; margin: 0 auto;">

                    <!-- Logo -->
                    <tr>
                        <td align="center" style="padding-bottom: 32px;">
                            <img src="https://api.esportra.com/storage/v1/object/public/system.assets.website/eSportra-Logo/eSportra-white-varianttext.png"
                                alt="Esportra" width="auto" height="80"
                                style="display: block; height: 80px; border: 0;">
                        </td>
                    </tr>

                    <!-- Card -->
                    <tr>
                        <td align="center" bgcolor="#18181b"
                            style="background-color: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 48px 40px;">
                            <h1 style="color: #ffffff; font-size: 24px; font-weight: 600; margin: 0 0 24px 0;">You've
                                been invited</h1>
                            <p style="color: #a1a1aa; font-size: 16px; line-height: 26px; margin: 0 0 32px 0;">
                                You have been invited to join the <strong>Esportra Partner Portal</strong>.<br>
                                Accept the invitation below to set your password and access your dashboard.
                            </p>

                            <!-- Button -->
                            <table border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td align="center" bgcolor="#e11d48"
                                        style="background-color: #e11d48; border-radius: 8px;">
                                        <a href="{{ .ConfirmationURL }}" target="_blank"
                                            style="display: inline-block; padding: 14px 32px; font-family: inherit; font-size: 16px; font-weight: 600; color: #ffffff !important; background-color: #e11d48; text-decoration: none; border-radius: 8px; border: 1px solid #e11d48;">
                                            <span style="color: #ffffff !important;">Accept Invitation</span>
                                        </a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding-top: 32px;">
                            <p style="color: #52525b; font-size: 12px; line-height: 20px; margin: 0;">
                                &copy; 2026 Esportra. All rights reserved.<br>
                                <a href="mailto:operations@esportra.com"
                                    style="color: #71717a !important; text-decoration: underline;">Contact Support</a>
                                &bull;
                                <a href="#" style="color: #71717a !important; text-decoration: underline;">Privacy
                                    Policy</a> &bull;
                                <a href="#" style="color: #71717a !important; text-decoration: underline;">Terms of
                                    Service</a>
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
