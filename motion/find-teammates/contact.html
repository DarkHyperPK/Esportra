<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact Sheet</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  :root { --black:#09090B; --panel:#111114; --ink:#FAFAFA; --sec:#A1A1AA; --hint:#71717A; --rose:#F43F5E; }
  body { margin:0; background:var(--black); color:var(--ink); font-family:Inter, sans-serif; width:1800px; }
  .wrap { padding:56px 60px 64px; }
  .eyebrow { font:600 13px/1.4 ui-monospace, monospace; letter-spacing:.28em; text-transform:uppercase; color:var(--sec); }
  h1 { font:900 56px/1 Poppins, sans-serif; letter-spacing:-.04em; margin:12px 0 8px; }
  .sub { color:var(--sec); font-size:15px; margin-bottom:36px; }
  .sub b { color:var(--ink); font-weight:600; }
  .fmt { display:flex; align-items:baseline; gap:16px; margin:40px 0 16px; border-top:1px solid rgba(255,255,255,.08); padding-top:20px; }
  .fmt h2 { font:800 26px/1 Poppins, sans-serif; letter-spacing:-.03em; margin:0; }
  .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:18px 16px; }
  figure { margin:0; }
  figure img { display:block; width:100%; border:1px solid rgba(255,255,255,.1); background:#000; }
  figcaption { display:flex; gap:10px; align-items:baseline; margin-top:8px; font-size:13px; color:var(--label, #E4E4E7); }
  figcaption .n { font:600 11px ui-monospace, monospace; letter-spacing:.16em; color:var(--hint); }
  figcaption .t { margin-left:auto; font:500 11px ui-monospace, monospace; color:var(--hint); font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--rose); margin-right:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="dot"></span>Esportra / Find Teammates reel</div>
  <h1>Contact sheet: one frame per beat.</h1>
  <div class="sub"><b>30 s · 120 BPM · 15 bars.</b> One timeline, three framings. Every UI pixel is a crop of the real app's screens; cursor clicks land on the beat.</div>
  <div id="sections"></div>
</div>
<script>
const beats = [
  ['01', 'Hook', 3.3, 'Still looking for a fifth?'],
  ['02', 'Product appears', 6.3, 'Logo slam, UI assembles'],
  ['03', 'Search', 9.2, 'Click + type “duelist”'],
  ['04', 'Filter', 12.0, 'Role chip, rank list → Diamond 1'],
  ['05', 'Save', 14.6, 'Bookmark click + burst'],
  ['06', 'Teams', 16.95, 'Tab click → rosters'],
  ['07', 'Connect', 19.8, 'Drawer + intro typing'],
  ['08', 'Requests', 22.15, 'Accept → connected'],
  ['09', 'Create', 25.6, 'Role + agents → live preview'],
  ['10', 'End card', 28.9, 'Find your next team.'],
];
const fmts = [['9x16', '9:16 · 1080×1920 (primary)'], ['1x1', '1:1 · 1080×1080'], ['16x9', '16:9 · 1920×1080']];
const root = document.getElementById('sections');
for (const [f, label] of fmts) {
  const h = document.createElement('div'); h.className = 'fmt';
  h.innerHTML = `<h2>${label}</h2>`; root.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid'; root.appendChild(g);
  for (const [n, name, t, what] of beats) {
    const file = `build/contact/${f}-${(Number.isInteger(t) ? t.toFixed(1) : String(t)).padStart(5, '0')}.png`;
    const fig = document.createElement('figure');
    fig.innerHTML = `<img src="${file}"><figcaption><span class="n">${n}</span><span>${name}</span><span class="t">${t.toFixed(2)}s</span></figcaption>`;
    if (f === '9x16') fig.title = what;
    g.appendChild(fig);
  }
}
</script>
</body>
</html>
